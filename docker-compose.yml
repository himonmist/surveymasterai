version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: surveymaster
      POSTGRES_PASSWORD: surveymaster_dev
      POSTGRES_DB: surveymasterai
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  web:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile
      target: runner
    restart: unless-stopped
    depends_on:
      - postgres
      - redis
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://surveymaster:surveymaster_dev@postgres:5432/surveymasterai
      REDIS_URL: redis://redis:6379
    ports:
      - "3000:3000"

volumes:
  postgres_data:
  redis_data:
